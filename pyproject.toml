[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gats"
version = "1.0.0"
description = "GATS — Graph-Augmented Tree Search with layered world models for efficient agent planning"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Maureese Williams", email = "maureesewilliams@gmail.com"}]
keywords = ["llm", "agents", "planning", "mcts", "tool-use", "world-models"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
llm = ["requests>=2.28.0"]   # Only needed for --backend ollama

[project.urls]
Repository = "https://github.com/MMWilliams/gats"
Paper = "https://github.com/MMWilliams/gats/blob/master/paper/gats_preprint.pdf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
